<title>The PPI Scuba Diver</title>
<meta charset="utf-8">
<style>
:root{
  --page:#eef3f7; --panel:#ffffff; --ink:#1f2225; --ink-2:#4d5257; --muted:#6c7176; --grid:#dfe3e6;
  --btn:#dbe2ea; --btn-on:#1f2225; --btn-on-ink:#ffffff; --tip-bg:#ffffff; --tip-edge:#d9d6d0; --focus:#3987e5;
  --up-1:#fed4cf; --up-2:#f7aba2; --up-3:#ed8074; --up-4:#e14d45; --up-5:#ba332f; --up-6:#7d1716;
  --dn-1:#cde2fb; --dn-2:#9ec5f4; --dn-3:#6da7ec; --dn-4:#3987e5; --dn-5:#256abf; --dn-6:#104281;
  --mid:#d9d7d2; --gap:#9a9ea3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#181A1B; --panel:#1f2224; --ink:#e4e5e6; --ink-2:#BBBDC0; --muted:#8C9094; --grid:#2A2E31;
    --btn:#2A2E31; --btn-on:#e4e5e6; --btn-on-ink:#181A1B; --tip-bg:#232628; --tip-edge:#3a3e41; --focus:#6da7ec;
    --mid:#5a5a57; --gap:#8C9094;
  }
}
:root[data-theme="dark"]{
  --page:#181A1B; --panel:#1f2224; --ink:#e4e5e6; --ink-2:#BBBDC0; --muted:#8C9094; --grid:#2A2E31;
  --btn:#2A2E31; --btn-on:#e4e5e6; --btn-on-ink:#181A1B; --tip-bg:#232628; --tip-edge:#3a3e41; --focus:#6da7ec;
  --mid:#5a5a57; --gap:#8C9094;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{container:page / inline-size}
#app{width:100%;min-width:0;max-width:1180px;margin:0 auto;padding:16px 16px 8px;height:780px;display:flex;flex-direction:column;container-type:inline-size}
body.is-embed #app{max-width:none;padding:10px 16px 6px;overflow:hidden}
/* hero mode (#hero=1): the scene alone, for the 1680x1080 post image */
body.is-hero #app{max-width:none;padding:0;height:100vh}
body.is-hero header,body.is-hero #controls,body.is-hero #timeline,body.is-hero #note,body.is-hero footer{display:none}
body.is-hero #stage{border-radius:0}
body.is-hero #readout{top:calc(7% + 10px);max-width:40%}
#herocap{display:none;position:absolute;right:16px;top:calc(7% + 12px);text-align:right;color:#f2f6fa;text-shadow:0 1px 3px rgba(0,20,40,.7);pointer-events:none}
body.is-hero #herocap{display:block}
#herocap .t{font-size:24px;font-weight:700;line-height:1.15}
#herocap .s{font-size:13.5px;line-height:1.4;color:#d6e2ec;margin-top:2px}
header h1{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700}
header p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.4;max-width:860px}
#controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0 6px}
.seg{display:inline-flex;background:var(--btn);border-radius:8px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
#legend .bar{display:flex;border-radius:3px;overflow:hidden}
#legend .bar span{display:block;width:20px;height:12px}
#legend .ticks{display:flex;font-size:11px;color:var(--muted)}
#legend .ticks span{width:20px;text-align:center}
#legend .gapkey{display:inline-flex;align-items:center;gap:5px}
#legend .gapkey i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--gap)}
#stage{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#readout{position:absolute;left:12px;top:8px;max-width:30%;color:#f2f6fa;text-shadow:0 1px 3px rgba(0,20,40,.7);pointer-events:none}
#readout .m{font-size:22px;font-weight:700;line-height:1.15}
#readout .v{font-size:14.5px;line-height:1.35;margin-top:2px}
#readout .v b{font-size:17px}
#readout .g{font-size:12px;line-height:1.35;margin-top:3px;color:#d6e2ec}
#readout .flag{margin-top:5px;font-size:12px;color:#fcd27a;font-weight:600}
#note,.note-probe{font-size:12.5px;line-height:1.45;color:var(--ink-2);padding-top:8px;box-sizing:border-box;overflow:hidden}
.note-probe b{color:var(--ink)}
#note b{color:var(--ink)}
#note .mark{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fab219;margin-right:5px;vertical-align:0}
#readout .ok{margin-top:5px;font-size:12px;color:#bfe6c4}
#table-wrap{position:absolute;inset:0;overflow:auto;display:none;background:var(--page)}
#table-wrap.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
caption{text-align:left;font-size:13px;color:var(--ink-2);padding:6px 8px}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{position:sticky;top:0;background:var(--page);color:var(--ink-2);font-weight:600;cursor:pointer;user-select:none}
td .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#timeline{display:flex;align-items:center;gap:10px;padding-top:8px}
#play{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;background:var(--btn-on);color:var(--btn-on-ink);
  padding:7px 12px;cursor:pointer;min-width:70px}
.step{font:inherit;font-size:14px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);padding:6px 10px;cursor:pointer}
#when{min-width:84px;font-size:14px;font-weight:700;white-space:nowrap}
#slider{flex:1;min-width:0;accent-color:var(--btn-on)}
footer{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);padding-top:6px;flex-wrap:wrap}
footer a{color:inherit}
#source{flex:1;min-width:0}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--tip-bg);border:1px solid var(--tip-edge);border-radius:8px;
  padding:9px 11px;font-size:12.5px;line-height:1.45;color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:290px;display:none}
#tip b{display:block;font-size:13.5px;margin-bottom:3px}
#tip .k{color:var(--muted)}
#tip .note{color:var(--muted);font-size:11.5px;margin-top:4px}
@container (max-width:620px){
  header h1{font-size:18px}
  header p{font-size:12.5px}
  #readout{max-width:62%}
  #readout .g,#readout .ok{display:none}
  #readout .flag{font-size:11px}
  #note,.note-probe{font-size:11.5px}
  header p,#source{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #readout .m{font-size:17px}
  #readout .v{font-size:12.5px}
  #legend .lbl{display:none}
  .seg button{padding:6px 9px;font-size:12.5px}
  #timeline{flex-wrap:wrap;row-gap:6px}
  #slider{flex:1 1 100%;order:5}
}
</style>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <p id="dek"></p>
  </header>
  <div id="controls">
    <div class="seg" role="group" aria-label="Display">
      <button data-mode="scene" aria-pressed="true">Diver</button>
      <button data-mode="table" aria-pressed="false">Table</button>
    </div>
    <div id="legend"></div>
  </div>
  <div id="stage">
    <canvas id="scene" role="img"></canvas>
    <div id="readout" aria-live="polite"></div>
    <div id="herocap" aria-hidden="true"><div class="t">The PPI Scuba Diver</div><div class="s">Every item in U.S. wholesale prices<br>Built by Data 4 The People</div></div>
    <div id="table-wrap"><table id="table"></table></div>
  </div>
  <div id="timeline">
    <button id="play" type="button">Play</button>
    <button class="step" id="prev" type="button" aria-label="Previous month">&#8249;</button>
    <button class="step" id="next" type="button" aria-label="Next month">&#8250;</button>
    <div class="seg" id="speed" role="group" aria-label="Speed">
      <button data-speed="1" aria-pressed="true">1x</button>
      <button data-speed="2" aria-pressed="false">2x</button>
      <button data-speed="4" aria-pressed="false">4x</button>
    </div>
    <div id="when"></div>
    <input id="slider" type="range" min="0" max="0" step="1" value="0" aria-label="Month">
  </div>
  <div id="note" aria-live="polite"></div>
  <footer>
    <span id="source"></span>
    <span id="credit">Built by <a href="https://www.data4thepeople.com" target="_blank" rel="noopener">Data 4 The People</a></span>
  </footer>
</div>
<div id="tip" role="tooltip"></div>
<script>
const T0 = performance.now();
const DATA = /*DATA*/{};
const EMBED = (() => { if (location.hash.includes('embed=0')) return false; if (location.hash.includes('embed=1')) return true;
  try { return window.self !== window.top; } catch (e) { return true; } })();
if (EMBED) { document.documentElement.setAttribute('data-theme', 'light'); document.body.classList.add('is-embed'); }
const HERO = location.hash.includes('hero=1');
if (HERO) document.body.classList.add('is-hero');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
const ORDER = DATA.order, N = ORDER.length, ITEMS = DATA.items;
const M = ORDER.map(t => DATA.months[t]);
const fmt = (v, d = 2) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const pct1 = v => fmt(v, 1) + '%';

$('#title').textContent = DATA.title;
$('#dek').textContent = DATA.dek;
$('#source').textContent = DATA.source;

// ---------- color: the item's own 12-month change, fixed bins ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let RAMP;
function readRamp() {
  RAMP = { up: [1,2,3,4,5,6].map(k => css('--up-' + k)), dn: [1,2,3,4,5,6].map(k => css('--dn-' + k)),
           mid: css('--mid'), gap: css('--gap') };
}
function colorFor(yoy) {
  if (yoy == null) return RAMP.mid;
  const a = Math.abs(yoy), s = DATA.color.steps;
  let k = 0; while (k < s.length && a >= s[k]) k++;      // 0..5
  if (a < 0.5) return RAMP.mid;
  return (yoy > 0 ? RAMP.up : RAMP.dn)[k];
}
function legend() {
  const s = DATA.color.steps, dn = RAMP.dn.slice().reverse();
  const bar = [...dn, RAMP.mid, ...RAMP.up].map(c => `<span style="background:${c}"></span>`).join('');
  // swatch j spans [20j, 20j+20); boundaries: 25,10,5,2,1 | 0.5 | mid | 0.5 | 1,2,5,10,25
  const ticks = [...s.slice().reverse().map((v, j) => [20 * (j + 1), '−' + v]), [130, '0'],
                 ...s.map((v, j) => [20 * (j + 8), '+' + v])];
  $('#legend').innerHTML = `<span class="lbl">Color: the item's price change over 12 months, %</span>
    <span style="position:relative;display:inline-block;padding-bottom:14px"><span class="bar">${bar}</span>${ticks.map(([x, l]) => `<span style="position:absolute;top:14px;left:${x - 12}px;width:24px;text-align:center;font-size:10.5px;color:var(--muted)">${l}</span>`).join('')}</span>
    <span class="gapkey"><i style="background:transparent;border:1.5px dashed var(--muted)"></i>Estimated: BLS publishes no index, so it uses its parent category's change</span>`;
}

// ---------- geometry ----------
const cv = $('#scene'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, G = {}, LAYOUT = [];
function geom() {
  const sky = Math.round(H * 0.07);
  const axisH = 26, floorTop = H - axisH - Math.round(H * 0.07);
  const yTop = sky + Math.round(H * 0.22), yBot = Math.round(H * 0.55);
  const cx = Math.round(W * 0.5);
  const monthPx = Math.max(46, Math.min(90, W / 13));
  const rMax = Math.min(H * 0.19, W * 0.17);
  return { sky, axisH, floorTop, yTop, yBot, cx, monthPx, rMax,
           k: Math.PI * 0.62 * rMax * rMax / Math.max(DATA.size.up, DATA.size.dn) };
}
const depthY = d => G.yTop + (d - DATA.axis.lo) / (DATA.axis.hi - DATA.axis.lo) * (G.yBot - G.yTop);

// Pack circles: largest first on a sunflower spiral, then separate overlaps.
// Deterministic, so a month always draws the same way.
function pack(list) {
  list.sort((a, b) => b.r - a.r);
  let area = 0;
  list.forEach((c, k) => {
    area += Math.PI * c.r * c.r;
    const rad = k ? Math.sqrt(area / (Math.PI * 0.72)) - c.r * 0.6 : 0, ang = k * 2.39996;
    c.x = Math.cos(ang) * rad; c.y = Math.sin(ang) * rad;
  });
  const cell = Math.max(6, (list[0] ? list[0].r : 6));
  for (let it = 0; it < 60; it++) {
    const grid = new Map();
    for (const c of list) { const k = Math.floor(c.x / cell) + ',' + Math.floor(c.y / cell); (grid.get(k) || grid.set(k, []).get(k)).push(c); }
    let moved = 0;
    for (const c of list) {
      const gx = Math.floor(c.x / cell), gy = Math.floor(c.y / cell), span = Math.ceil(c.r * 2 / cell) + 1;
      for (let i = -span; i <= span; i++) for (let j = -span; j <= span; j++) {
        const b = grid.get((gx + i) + ',' + (gy + j)); if (!b) continue;
        for (const d of b) {
          if (d === c) continue;
          let dx = d.x - c.x, dy = d.y - c.y, dist = Math.hypot(dx, dy); const m = c.r + d.r + 1;
          if (dist >= m) continue;
          if (dist < 1e-6) { dx = 1; dy = 0; dist = 1; }
          const push = (m - dist) / 2, wc = d.r * d.r / (c.r * c.r + d.r * d.r);
          c.x -= dx / dist * push * 2 * wc; c.y -= dy / dist * push * 2 * wc;
          d.x += dx / dist * push * 2 * (1 - wc); d.y += dy / dist * push * 2 * (1 - wc);
          moved++;
        }
      }
    }
    for (const c of list) { c.x *= 0.995; c.y *= 0.995; }       // gentle pull to the center
    if (!moved) break;
  }
  let top = 0, bot = 0, R = 0;
  for (const c of list) { top = Math.min(top, c.y - c.r); bot = Math.max(bot, c.y + c.r); R = Math.max(R, Math.hypot(c.x, c.y) + c.r); }
  return { list, top, bot, R };
}
const MIN_R = 0.7;
const GAP = 34;        // px between the diver and the nearest edge of each cluster
function layoutMonth(mi) {
  const m = M[mi], up = [], dn = [];
  m.r.forEach((row, i) => {
    if (!row) return;
    const r = Math.sqrt(G.k * Math.abs(row[1]) / Math.PI);
    if (r < MIN_R) return;
    (row[1] > 0 ? up : dn).push({ i, r });
  });
  if (Math.abs(m.gap) > 0) {
    // The unexplained part is always drawn, at least 1px across, even when tiny.
    const r = Math.max(1, Math.sqrt(G.k * Math.abs(m.gap) / Math.PI));
    (m.gap > 0 ? up : dn).push({ i: -1, r });
  }
  return { up: pack(up), dn: pack(dn) };
}
function resize() {
  const rect = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, rect.width); H = Math.max(300, rect.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  G = geom();
  // One size scale for all months, set so every month's clusters fit between
  // the surface and the date axis at that month's depth. Estimated from each
  // cluster's total area (packing fills about 62% of its circle); months are
  // packed only when drawn, and the rest in the background.
  // The estimate runs a little large, so the tightest months are then packed
  // for real and the scale set from their actual heights. Packing scales with
  // the radius, so a ratio of heights gives the ratio of radii.
  const room = (m) => { const y = depthY(m.pub); return [H - G.axisH - 6 - y - GAP, y - GAP - G.sky * 0.4]; };
  const est = M.map((m, i) => {
    let up = Math.max(m.gap, 0), dn = Math.max(-m.gap, 0);
    for (const r of m.r) if (r) { if (r[1] > 0) up += r[1]; else dn -= r[1]; }
    const [roomB, roomA] = room(m);
    const hB = 2.15 * Math.sqrt(G.k * up / (Math.PI * 0.62)), hA = 2.15 * Math.sqrt(G.k * dn / (Math.PI * 0.62));
    return [Math.min(hB ? roomB / hB : 9, hA ? roomA / hA : 9), i];
  }).sort((a, b) => a[0] - b[0]);
  let need = Math.min(1, est[0][0]);
  G.k *= Math.max(0.05, need) ** 2;
  // One pass on the four tightest months (about 40 ms each). The 1px spacing
  // between circles does not scale, hence the small margin; the build checks
  // that every month fits.
  let f = Infinity;
  for (const [, i] of est.slice(0, 4)) {
    const L = layoutMonth(i), [roomB, roomA] = room(M[i]);
    const hB = L.up.bot - L.up.top, hA = L.dn.bot - L.dn.top;
    f = Math.min(f, hB > 0 ? roomB / hB : Infinity, hA > 0 ? roomA / hA : Infinity);
  }
  G.k *= Math.min(f * 0.98, 4) ** 2;
  LAYOUT = new Array(N).fill(null);
  clearTimeout(bgTimer); bgNext = 0; bgTimer = setTimeout(background, 400);
}
let bgTimer = 0, bgNext = 0;
function lay(i) { return LAYOUT[i] || (LAYOUT[i] = layoutMonth(i)); }
function background() {          // pack the remaining months a few at a time
  const t0 = performance.now();
  while (bgNext < N && performance.now() - t0 < 12) lay(bgNext++);
  if (bgNext < N) bgTimer = setTimeout(background, 30);
}

// ---------- scenery (world x in month units, deterministic) ----------
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function floorY(wx) {      // gentle seafloor contour in px offset
  return Math.sin(wx * 0.9) * 6 + Math.sin(wx * 2.3 + 1) * 3;
}
const FISH = Array.from({ length: 6 }, (_, i) => ({ y: 0.16 + rnd(i + 1) * 0.36, sp: 0.35 + rnd(i + 9) * 0.4, ph: rnd(i + 3) * 40, s: 0.7 + rnd(i + 5) * 0.5 }));

// ---------- state ----------
let pos = N - 1, target = N - 1, playing = false, speed = 1, lastT = 0, clock = 0, hover = null, frameHits = [];
const MS_PER_MONTH = 1300;
const hashMonth = (location.hash.match(/month=(\d{4}-\d{2})/) || [])[1];
if (hashMonth && ORDER.includes(hashMonth)) pos = target = ORDER.indexOf(hashMonth);

function curIndex() { return Math.round(pos); }

// ---------- drawing ----------
function waterGradient() {
  const g = ctx.createLinearGradient(0, G.sky, 0, H);
  g.addColorStop(0, '#3f9fc8'); g.addColorStop(0.35, '#1f6e9c'); g.addColorStop(0.7, '#0f3f63'); g.addColorStop(1, '#061e33');
  return g;
}
function drawBackground(scroll, depthNow) {
  // sky and surface
  const sk = ctx.createLinearGradient(0, 0, 0, G.sky);
  sk.addColorStop(0, '#cfe8f6'); sk.addColorStop(1, '#a9d6ee');
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, G.sky);
  ctx.fillStyle = waterGradient(); ctx.fillRect(0, G.sky, W, H - G.sky);
  // light rays near the surface
  ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 5; i++) {
    const x = ((i * 0.23 + 0.05) * W - scroll * 0.15 * G.monthPx) % (W + 200);
    const xx = x < -100 ? x + W + 200 : x;
    ctx.beginPath(); ctx.moveTo(xx, G.sky); ctx.lineTo(xx + 60, G.sky); ctx.lineTo(xx - 40, H * 0.55); ctx.lineTo(xx - 120, H * 0.55); ctx.fill();
  }
  ctx.restore();
  // waves on the surface
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = 0; x <= W; x += 8) { const y = G.sky + Math.sin((x + scroll * G.monthPx) * 0.03 + clock * 0.0015) * 2; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  // risk: the water darkens as the diver goes deeper (fixed scale)
  const risk = Math.max(0, Math.min(1, (depthNow - DATA.axis.lo) / (DATA.axis.hi - DATA.axis.lo)));
  const dark = ctx.createRadialGradient(G.cx, depthY(depthNow), 40, G.cx, depthY(depthNow), Math.max(W, H) * 0.8);
  dark.addColorStop(0, `rgba(2,10,22,${0.05 + risk * 0.15})`); dark.addColorStop(1, `rgba(2,8,18,${0.15 + risk * 0.55})`);
  ctx.fillStyle = dark; ctx.fillRect(0, G.sky, W, H - G.sky);
}
function drawFish(scroll, depthNow) {
  for (const f of FISH) {
    const wx = (f.ph + clock * 0.00004 * f.sp * 60 - scroll * 0.5) ;
    let x = ((wx * 90) % (W + 120)); if (x < 0) x += W + 120; x -= 60;
    const y = G.sky + f.y * (H - G.sky) + Math.sin(clock * 0.002 + f.ph) * 4;
    ctx.save(); ctx.translate(x, y); ctx.scale(f.s, f.s);
    ctx.fillStyle = 'rgba(255,214,120,.85)';

  $('#table').innerHTML = `<caption>${m.label}: ${rows.length} items. Final demand ${pct1(m.pub)}; items add up to ${fmt(m.sum)}; not explained ${fmt(m.gap, 3)} points.</caption>
    <thead><tr>${head.map(([k, l]) => `<th data-k="${k}" tabindex="0" aria-sort="${k === sortKey ? (sortDir < 0 ? 'descending' : 'ascending') : 'none'}">${l}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr><td><span class="sw" style="background:${colorFor(r.yoy)}"></span>${r.name}</td><td>${r.group}</td><td>${r.yoy == null ? '' : fmt(r.yoy, 1) + (r.est ? ' est.' : '')}</td><td>${r.w.toFixed(3)}</td><td>${fmt(r.contrib, 4)}</td><td>${r.filled}</td></tr>`).join('')}
    <tr><td><span class="sw" style="background:${RAMP.gap}"></span>Not explained by the items</td><td></td><td></td><td></td><td>${fmt(m.gap, 4)}</td><td></td></tr></tbody>`;
  $('#table').querySelectorAll('th').forEach(th => {
    const go = () => { const k = th.dataset.k; sortDir = k === sortKey ? -sortDir : (k === 'name' || k === 'group' || k === 'filled' ? 1 : -1); sortKey = k; table(); };
    th.onclick = go; th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}
// What the price change in a row is. r[4] flags: 1 own index for part of the
// year only, 2 in final demand only since December, 4 only through December,
// 8 the change is borrowed from the parent category (estimated).
function priceLabel(row) {
  const f = row[4], when = f & 2 ? ' since December' : f & 4 ? ' through December' : ' over 12 months';
  return (f & 8 ? 'Price change used, estimated' : 'Its own price change') + when;
}
function priceNote(row) {
  const f = row[4], p = row[3] >= 0 ? DATA.parents[row[3]] : '';
  const parts = [];
  if (f & 2) parts.push('This item entered final demand in January, so it counts only from December on.');
  if (f & 4) parts.push('This item left final demand in January, so it counts only through December.');
  if (p && f & 1) parts.push(`BLS publishes this item's index for only part of these months. For the rest, it uses the change for ${p}.`);
  else if (p && f & 8) parts.push(`BLS does not publish this item's index for these months. It uses the change for ${p}, so this change is an estimate.`);
  else if (p) parts.push(`BLS skips this item's December index, which the weights need, so its contribution uses the change for ${p}.`);
  return parts.length ? `<div class="note">${parts.join(' ')}</div>` : '';
}
const tip = $('#tip');
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let hit = null;
  for (let k = frameHits.length - 1; k >= 0; k--) { const h = frameHits[k]; if ((h.x - x) ** 2 + (h.y - y) ** 2 <= h.r * h.r) { hit = h; break; } }
  hover = hit;
  if (!hit) { tip.style.display = 'none'; return; }
  const m = M[curIndex()];
  if (hit.i < 0) {
    tip.innerHTML = `<b>Not explained by the items</b><span class="k">Part of the 12-month change:</span> ${fmt(m.gap, 3)} points
      <div class="note">The items add up to ${fmt(m.sum)} points; BLS's index gives ${fmt(m.pub)}. The difference comes from items whose prices BLS does not publish, which are estimated from their parent category, and from rounding.</div>`;
  } else {
    const row = m.r[hit.i], it = ITEMS[hit.i];
    if (!row) { tip.style.display = 'none'; return; }
    tip.innerHTML = `<b>${it[1]}</b><span class="k">${it[3]}</span><br>
      <span class="k">Added to the 12-month change:</span> ${fmt(row[1], 3)} points<br>
      <span class="k">${priceLabel(row)}:</span> ${row[0] == null ? 'n/a' : pct1(row[0])}<br>
      <span class="k">Weight:</span> ${row[2].toFixed(3)}% of final demand
      ${priceNote(row)}`;
  }
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - tw - 8, e.clientX + 14) + 'px';
  tip.style.top = Math.min(innerHeight - th - 8, e.clientY + 14) + 'px';
});
cv.addEventListener('mouseleave', () => { hover = null; tip.style.display = 'none'; });

// ---------- controls ----------
function setPlaying(p) {
  playing = p; $('#play').textContent = p ? 'Pause' : 'Play';
  if (p && pos >= N - 1) { pos = target = 0; }
}
$('#play').onclick = () => setPlaying(!playing);
$('#prev').onclick = () => { setPlaying(false); target = Math.max(0, Math.round(pos) - 1); };
$('#next').onclick = () => { setPlaying(false); target = Math.min(N - 1, Math.round(pos) + 1); };
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed; document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
const slider = $('#slider'); slider.max = N - 1;
slider.oninput = () => { setPlaying(false); target = +slider.value; };
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  const t = b.dataset.mode === 'table';
  document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#table-wrap').classList.toggle('on', t); $('#readout').style.display = t ? 'none' : '';
  if (t) table();
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,th')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowLeft') $('#prev').click();
  if (e.key === 'ArrowRight') $('#next').click();
});

readRamp(); legend(); resize();
let lastSize = '';
sizeNote();
new ResizeObserver(sizeNote).observe($('#app'));
new ResizeObserver(() => {
  const r = $('#stage').getBoundingClientRect(), k = Math.round(r.width) + 'x' + Math.round(r.height);
  if (k !== lastSize) { lastSize = k; resize(); }
}).observe($('#stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readRamp(); legend(); lastReadout = -1; });
requestAnimationFrame(frame);
document.body.setAttribute('data-ready', '1');
document.body.setAttribute('data-ms', Math.round(performance.now() - T0));
</script>
